# =============================================================================
# Paperclip Helm Chart - OVH Production Values
# Cluster: kubernetes-admin@services  |  Namespace: paperclip (NOT platform)
# =============================================================================
# Clean reinstall decided by the owner on 2026-10-08 (ADR-158 §0-ter.5: «vamos
# limpio y lo reinstalamos desde cero… trabájalo desde ahí y prepáralo»).
# Installed on 2026-10-09 with alebrije-infra/scripts/paperclip-reinstalar-desde-cero.sh,
# never by hand; its `instalar` phase (helm upgrade --install --atomic) also upgrades it.
#
# Why namespace paperclip: the kubernetes sandbox provider hardcodes it as the
# server namespace for the agents' callback NetworkPolicy (plugin.ts
# PAPERCLIP_SERVER_NAMESPACE = "paperclip"); the chart refuses any other one with
# kubernetesExecution on. It also takes Paperclip out of the namespace shared by
# every platform service.
# =============================================================================

nameOverride: ""
fullnameOverride: ""
timezone: "America/Mexico_City"

# -- Image: OUR build = the official ghcr.io/paperclipai/paperclip:2026.1005.0
# (index digest sha256:de762433…, measured on GHCR 2026-10-08) plus the
# kubernetes sandbox provider compiled exactly like upstream's `cloud` target
# does (image/Dockerfile). The official image ships that provider as source only
# («bundle not present» at boot), so without this build agents cannot run in
# sandboxes. Pinned by digest (ADR-158 M13); the chart refuses an empty digest.
image:
  repository: docker.io/ileonelperea/paperclip
  tag: "2026.1005.0-k8s.3"
  # Filled by scripts/build-images.sh (prints the pushed digest).
  digest: "sha256:cf45a8bb9eb10162a19c325fa9d4be246902ee1bb0f62acd59da01a2b4fbaef4"
  requireDigest: true
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: regcred

replicaCount: 1

# A fresh database applies every migration (0001…0293) before listening; keep the
# 15-minute window measured for the 2026-09-29 jump instead of ~5 minutes.
startupProbe:
  failureThreshold: 90

# =============================================================================
# Service / Ingress
# =============================================================================
service:
  type: ClusterIP
  port: 3100
  annotations: {}

ingress:
  # crew.alebrije.io goes cloudflared → Traefik (internal entry) → IngressRoute
  # with the ForwardAuth gate, all in alebrije-infra (ADR-162 D13).
  enabled: false

# =============================================================================
# Resources — kept from the 2026-09-29 sizing (OOM at 512Mi with ~253 MB heap).
# Agents no longer run in this pod (kubernetesExecution), so this is headroom;
# re-measure after a week of real runs before lowering it.
# =============================================================================
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 3Gi

# NO global model key in the pod (Regla R / ADR-158 §1.2-bis): every company gets
# its own AI connection through alebrije-adapt-paperclip (the platform company with
# the platform key, each tenant with its own).
extraEnv:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=1536"
  - name: PAPERCLIP_MIGRATION_AUTO_APPLY
    value: "true"
  # Hostname guard (and better-auth's trusted origins): the platform team's host,
  # the tenants' host and the in-cluster FQDN the adapter calls. agentes.alebrije.io
  # (owner 2026-10-10: «que cada tenant pueda entrar desde su dashboard») is where a
  # tenant user lands in ITS company, behind alebrije-adapt-paperclip's tenant gate
  # (alebrije-infra ingressroutes/agentes-paperclip-tunel.yaml). Without it here the
  # guard refuses the host and better-auth refuses the session's origin.
  - name: PAPERCLIP_ALLOWED_HOSTNAMES
    value: "crew.alebrije.io,agentes.alebrije.io,paperclip.paperclip.svc.cluster.local"

# =============================================================================
# Persistence - /paperclip volume (new claim in the new namespace)
# =============================================================================
persistence:
  enabled: true
  storageClass: "csi-cinder-high-speed"
  accessMode: ReadWriteOnce
  size: 10Gi

# =============================================================================
# Application Config
# =============================================================================
config:
  port: 3100
  serveUI: true
  deploymentMode: authenticated
  deploymentExposure: private
  publicURL: "https://crew.alebrije.io"

# Secrets come from Vault through ESO (vault block below); the chart's own Secret
# templates render nothing with vault.enabled.
auth:
  betterAuthSecret: ""
  existingSecret: ""
  existingSecretKey: "better-auth-secret"
  # Sign-up CLOSED in steady state (audit 2026-10-08): the sandbox agents reach port
  # 3100 and could otherwise sign up from inside the cluster; the edge already
  # answers 403. The install script opens it only for the phases that create users
  # (admin, conexiones, dueno) and closes it after.
  disableSignUp: true

# =============================================================================
# PostgreSQL — bundled, in this namespace, pinned by digest (the same
# postgres:16-alpine digest as postgres-prod-patch.yaml in alebrije-infra); size
# and requests per the ADR-50 addendum (re-measured 2026-10-02). Its daily
# pg_dump to OVH is alebrije-infra/k8s/prod/paperclip/backup.yaml.
# =============================================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    digest: "sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: "csi-cinder-classic"
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 65m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    database: paperclip
    username: paperclip
    password: ""
    existingSecret: ""

externalDatabase:
  url: ""
  existingSecret: ""
  existingSecretKey: "database-url"

# =============================================================================
# Vault + ESO — the cluster's existing ClusterSecretStore (vault-backend; its
# eso-role reads alebrije/data/*). Seeded by
# alebrije-infra/scripts/seed-vault-paperclip-instancia.sh (never rotates on
# re-run) and seed-vault-paperclip-crew-handoff.sh.
# =============================================================================
vault:
  enabled: true
  clusterSecretStoreName: "vault-backend"
  authKey: "platform/paperclip/v2/auth"
  authProperty: "better-auth-secret"
  dbKey: "platform/paperclip/v2/db"
  imagePullSecret:
    name: regcred
    registry: "https://index.docker.io/v1/"
    vaultKey: ci/dockerhub
    usernameProperty: username
    tokenProperty: token
  refreshInterval: "1h"
  deletionPolicy: "Retain"

# =============================================================================
# Kubernetes execution (ADR-158 §0-ter.2) — every agent run in its company's own
# namespace paperclip-sbx-<company id>: Pod Security restricted, deny-all network
# with egress only to DNS, this server and public IPv4 443/80 (the standard-mode
# fallback for the adapter's FQDNs; Calico/Canal cannot filter by FQDN), non-root,
# read-only rootfs, a Secret per run. backend job: stable, no CRD (the
# agent-sandbox controller for sandbox-cr is alpha and not installed).
# =============================================================================
kubernetesExecution:
  enabled: true
  backend: job
  namespacePrefix: "paperclip-sbx-"
  adapterType: claude_local
  egressMode: standard
  egressAllowCidrs: []
  egressAllowFqdns: []
  runtimeClassName: ""
  rpcTimeoutMs: ""
  # Runtime image built from upstream docker/agent-runtime at v2026.1005.0
  # (scripts/build-images.sh; ghcr.io/paperclipai/agent-runtime-* answers 404 to
  # anonymous pulls). It stays PRIVATE like every image of ours (decided 2026-10-09:
  # nothing published): each sandbox namespace gets regcred and the provider's
  # ServiceAccount carrying it (sandboxImagePullSecret below).
  # Only claude_local stays available on the instance.
  adapters:
    - adapterType: claude_local
      # Filled by scripts/build-images.sh: docker.io/ileonelperea/agent-runtime-claude:<tag>@sha256:<digest>
      runtimeImage: "docker.io/ileonelperea/agent-runtime-claude:2026.1005.0-1@sha256:61b823414ea68cccffe5284232ab8557d35ded43a9e72455ff8af90f45da3ed2"
  apiServer:
    # EndpointSlice of the `kubernetes` Service, measured 2026-10-08; same rule as
    # platform/temporal-worker-egress-apiserver.
    cidrs: ["10.3.0.1/32"]
    ports: [443, 6443]
  admissionPolicy:
    enabled: true
  # Filled by the install script after provisioning (fase conexiones): the company
  # ids of Alebrije Plataforma, Alebrije and lafelabs, one sandbox namespace each.
  sandboxCompanyIds: ["0c1dde63-2475-4d31-b5cb-510dae11cd4b", "003b927e-5941-4062-9223-5a98ae242277", "2cdeb7d1-a238-4fe5-b45d-e36eb76ba705"]
  # regcred (Vault ci/dockerhub, vault.imagePullSecret) + paperclip-tenant-sa in each
  # sandbox namespace, so the private runtime image is pulled with our credentials.
  sandboxImagePullSecret: true

# =============================================================================
# Password-less entry from the platform (ADR-158 §0-ter.4). companyId is the
# PLATFORM company («Alebrije Plataforma», tenant alebrije-platform), known only
# after the adapter provisions it: the install script sets it in a second pass.
# =============================================================================
crewHandoff:
  enabled: true
  secretName: paperclip-crew-handoff
  secretKey: handoff-key
  vaultKey: services/adapt-paperclip
  vaultProperty: CREW_HANDOFF_KEY
  workspaceId: alebrije-crew
  companyId: "0c1dde63-2475-4d31-b5cb-510dae11cd4b"

# =============================================================================
# Security Contexts
# =============================================================================
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  # The entrypoint starts as root (tini, pid 1) and drops the server to `node`
  # (uid 1000) via setuid() — measured 2026-10-08 in /proc: tini uid 0, server
  # uid 1000. CAP_SETUID must stay, so ALL cannot be dropped.
  runAsNonRoot: false
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_CHROOT

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

# =============================================================================
# NetworkPolicy — this namespace starts empty, so the chart's policies are the
# whole picture: Traefik (crew), the platform adapter, the sandbox agents.
# =============================================================================
networkPolicy:
  enabled: true
  traefikNamespace: "services"
  extraIngress:
    - namespace: platform
      podLabels:
        app: alebrije-adapt-paperclip
      description: "alebrije-adapt-paperclip (provisioning, board keys, routines, decisions)"

reloader:
  enabled: true
