# =============================================================================
# Paperclip Helm Chart - OVH Production Values
# Cluster: kubernetes-admin@services  |  Namespace: platform
# Storage: csi-cinder-high-speed (OVH Cinder default)
# =============================================================================

nameOverride: ""
fullnameOverride: ""
timezone: "America/Mexico_City"

# -- Image — pinned by DIGEST (ADR-158 M13). `latest` resolved to this same
# release on 2026-09-26 and a pod restart pulled it unannounced; with
# `pullPolicy: Always` + a floating tag any restart can change the version.
# Release 2026.916.1 (2026-09-21), multi-arch index digest measured on GHCR
# 2026-09-29 (amd64 f203471a…, arm64 4e2e1e59…).
image:
  repository: ghcr.io/paperclipai/paperclip
  tag: "2026.916.1@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c"
  pullPolicy: IfNotPresent

# 1 by owner order (2026-09-29: «puedes levantar paperclip… ajusta capacidades
# para que se levante»). Was 0 from 2026-09-28 (D9) after 608 crash loops:
# `JavaScript heap out of memory` at ~253 MB of heap with a 512Mi limit (the
# production image sets no NODE_OPTIONS, so V8 sized the heap from the cgroup).
replicaCount: 1

# The first boot of 2026.916.1 against the April schema applies every pending
# migration before listening; give it 15 min instead of ~5 before the kubelet
# restarts it mid-migration.
startupProbe:
  failureThreshold: 90

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 3100
  annotations: {}

# =============================================================================
# Ingress - Traefik (standard Ingress class)
# =============================================================================
ingress:
  # Disabled — cluster uses Traefik IngressRoute CRD (see ingressroute-paperclip.yaml)
  enabled: false

# =============================================================================
# Resources
# =============================================================================
# Sized 2026-09-29 against the single r3-32 node (4 CPU / 30 GiB allocatable;
# CPU requests 3341m = 87 % booked, real use 715m; memory requests 10.2 GiB,
# real use 16 GiB). Memory is what killed it: the server heap is capped at
# 1.5 GiB (NODE_OPTIONS below) and the agent CLIs it spawns (claude-code et al.)
# run in this same container, so the limit leaves ~1.5 GiB above the heap.
# CPU request stays small (idle Node server) so rollouts of the rest of the
# platform keep their headroom; the limit lets agent runs burst.
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 3Gi

# NO global model key in the pod (Regla R / ADR-158 §1.2-bis): every company
# gets its own AI connection through alebrije-adapt-paperclip (the platform
# company with Alebrije's key, each tenant with its own). The old
# ANTHROPIC_API_KEY extraEnv of release rev 8/9 is gone on purpose.
extraEnv:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=1536"
  # Explicit instead of relying on config.json in the PVC: the non-TTY default
  # already auto-applies, this makes it a declared decision.
  - name: PAPERCLIP_MIGRATION_AUTO_APPLY
    value: "true"
  # Sign-up OPEN inside the cluster, CLOSED on the internet: the crew
  # IngressRoute sends /api/auth/sign-up to deny-all-loopback-only (403,
  # alebrije-infra k8s/prod/ingressroutes/crew-paperclip.yaml, measured
  # 2026-09-29), and the NetworkPolicies only let Traefik and
  # alebrije-adapt-paperclip reach port 3100. Paperclip creates users only by
  # sign-up, and the adapter creates one per tenant (ADR-158 §2.3).
  - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
    value: "false"

# =============================================================================
# Persistence - /paperclip volume
# =============================================================================
persistence:
  enabled: true
  storageClass: "csi-cinder-high-speed"
  accessMode: ReadWriteOnce
  size: 10Gi

# =============================================================================
# Application Config
# =============================================================================
config:
  port: 3100
  serveUI: true
  deploymentMode: authenticated
  deploymentExposure: private
  publicURL: "https://crew.alebrije.io"

# =============================================================================
# Auth Secret (BETTER_AUTH_SECRET)
# Secret creado manualmente: kubectl create secret generic paperclip-auth-secret
# =============================================================================
auth:
  betterAuthSecret: ""
  existingSecret: "paperclip-auth-secret"
  existingSecretKey: "better-auth-secret"

# =============================================================================
# External Database - usa postgres existente en namespace platform
# postgres.platform.svc.cluster.local:5432
# Secret creado manualmente: kubectl create secret generic paperclip-db-secret
# =============================================================================
postgresql:
  enabled: false

externalDatabase:
  url: ""
  existingSecret: "paperclip-db-secret"
  existingSecretKey: "database-url"

# =============================================================================
# Vault + ESO - deshabilitado inicialmente
# Activar cuando los paths existan en Vault: secret/data/paperclip/*
# =============================================================================
vault:
  enabled: false
  address: "http://vault.vault.svc.cluster.local:8200"
  tlsSkipVerify: false
  role: "paperclip"
  mount: "paperclip"
  authPath: "kubernetes"
  serviceAccount: "paperclip-vault-auth"
  namespace: "vault"
  refreshInterval: "1h"
  deletionPolicy: "Retain"

# =============================================================================
# Security Contexts
# =============================================================================
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  # Paperclip entrypoint starts as root then drops to 'node' via setuid().
  # CAP_SETUID must be retained — drop: ALL removes it and breaks the user switch.
  # runAsNonRoot/runAsUser are nulled so K8s doesn't enforce a UID before the switch.
  runAsNonRoot: false
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_CHROOT

# =============================================================================
# Scheduling
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# ServiceAccount
# =============================================================================
serviceAccount:
  create: true
  name: ""
  annotations: {}

# =============================================================================
# Autoscaling - deshabilitado (app stateful via PVC)
# =============================================================================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# =============================================================================
# PodDisruptionBudget
# =============================================================================
podDisruptionBudget:
  enabled: false

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicy:
  enabled: true
  traefikNamespace: "services"

# =============================================================================
# Reloader (Stakater) - instalado en el cluster OVH
# =============================================================================
reloader:
  enabled: true
