{{- if and .Values.image.requireDigest (not .Values.image.digest) }}
{{- fail "image.digest is required (ADR-158 M13: never a floating tag)" }}
{{- end }}
{{- if .Values.kubernetesExecution.enabled }}
{{- if not .Values.kubernetesExecution.adapters }}
{{- fail "kubernetesExecution.adapters must list each adapter with its runtime image pinned by digest" }}
{{- end }}
{{- range .Values.kubernetesExecution.adapters }}
{{- if not (contains "@sha256:" (.runtimeImage | default "")) }}
{{- fail (printf "runtime image of adapter %s is not pinned by digest" (.adapterType | default "?")) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.kubernetesExecution.enabled (ne .Release.Namespace "paperclip") }}
{{- fail "kubernetesExecution needs the release in namespace \"paperclip\": the sandbox provider hardcodes it (plugin.ts PAPERCLIP_SERVER_NAMESPACE) for the agents callback NetworkPolicy" }}
{{- end }}
{{- if and .Values.kubernetesExecution.enabled .Values.networkPolicy.enabled (not .Values.kubernetesExecution.apiServer.cidrs) }}
{{- fail "kubernetesExecution with networkPolicy needs kubernetesExecution.apiServer.cidrs (the kubernetes Service endpoint) or the provider cannot reach the API" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperclip.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "paperclip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperclip.labels" . | nindent 8 }}
        {{- if .Values.kubernetesExecution.enabled }}
        # The provider's sandbox NetworkPolicy lets agent pods reach ONLY pods
        # labelled app=paperclip-server in namespace paperclip (network-policy.ts).
        app: paperclip-server
        {{- end }}
      annotations:
        {{- include "paperclip.checksumAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "paperclip.serviceAccountName" . }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: "busybox:1.36"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ include "paperclip.postgresServiceName" . }}:5432..."
              MAX=60
              i=0
              while [ $i -lt $MAX ]; do
                if nc -zw2 {{ include "paperclip.postgresServiceName" . }} 5432 2>/dev/null; then
                  echo "PostgreSQL is ready!"
                  exit 0
                fi
                i=$((i+1))
                echo "Attempt $i/$MAX: not ready, retrying in 5s..."
                sleep 5
              done
              echo "ERROR: PostgreSQL did not become ready in time"
              exit 1
      {{- end }}
      containers:
        - name: paperclip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "paperclip.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.dbSecretName" . }}
                  {{- if .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
                  {{- else }}
                  key: database-url
                  {{- end }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperclip.secretName" . }}
                  key: {{ .Values.auth.existingSecretKey | default "better-auth-secret" }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.kubernetesExecution.enabled }}
            {{- with .Values.kubernetesExecution }}
            # Every agent run of every company goes to that company's sandbox
            # namespace, never to this pod (execution-policy-bootstrap.ts; the
            # per-run guard in heartbeat.ts refuses local execution).
            - name: PAPERCLIP_EXECUTION_MODE
              value: "kubernetes"
            - name: PAPERCLIP_K8S_IN_CLUSTER
              value: "true"
            - name: PAPERCLIP_K8S_BACKEND
              value: {{ .backend | quote }}
            - name: PAPERCLIP_K8S_NAMESPACE_PREFIX
              value: {{ .namespacePrefix | quote }}
            - name: PAPERCLIP_K8S_ADAPTER_TYPE
              value: {{ .adapterType | quote }}
            - name: PAPERCLIP_K8S_EGRESS_MODE
              value: {{ .egressMode | quote }}
            {{- with .egressAllowCidrs }}
            - name: PAPERCLIP_K8S_EGRESS_ALLOW_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .egressAllowFqdns }}
            - name: PAPERCLIP_K8S_EGRESS_ALLOW_FQDNS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .runtimeClassName }}
            - name: PAPERCLIP_K8S_RUNTIME_CLASS_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .rpcTimeoutMs }}
            - name: PAPERCLIP_K8S_RPC_TIMEOUT_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .adapters }}
            # Adapter registry: runtime images pinned by digest; only the listed
            # adapter types stay available (adapter-registry-bootstrap.ts).
            - name: PAPERCLIP_ADAPTERS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.crewHandoff.enabled }}
            {{- with .Values.crewHandoff }}
            # Password-less entry from the platform: Paperclip's own login handoff
            # (workspace-login-handoff*.ts), registered only with the key; ONE
            # company per instance. optional: without the Secret Paperclip still
            # starts, only the password-less entry is missing.
            - name: PAPERCLIP_WORKSPACE_HANDOFF_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: true
            - name: PAPERCLIP_EXECUTION_WORKSPACE_ID
              value: {{ .workspaceId | quote }}
            {{- with .companyId }}
            - name: PAPERCLIP_EXECUTION_WORKSPACE_COMPANY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            # The server applies pending DB migrations BEFORE it listens; a jump
            # across many releases needs more than the default ~5 min window, and
            # a kill mid-migration is worse than a slow first boot.
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
      volumes:
        - name: paperclip-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperclip.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
