{{- if .Values.networkPolicy.enabled }}
---
# NetworkPolicy: Paperclip server — ingress from Traefik + egress to postgres/DNS/HTTPS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paperclip.fullname" . }}-allow-traefik
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paperclip.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace | default "services" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.allowFromNamespace }}
    # Allow from additional namespace (e.g. monitoring)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowFromNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
    {{- if .Values.kubernetesExecution.enabled }}
    # Agent pods in the sandbox namespaces call back to the server (BOOTSTRAP_TOKEN,
    # port 3100). Matches the provider's own egress rule from those namespaces.
    - from:
        - namespaceSelector:
            matchLabels:
              paperclip.io/managed-by: paperclip-k8s-plugin
          podSelector:
            matchLabels:
              paperclip.io/role: agent
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
    {{- end }}
    {{- range .Values.networkPolicy.extraIngress }}
    # {{ .description | default "extra ingress" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.config.port }}
    {{- end }}
  egress:
    {{- if .Values.postgresql.enabled }}
    # Its own bundled Postgres only (audit 2026-10-08: «any host:5432» let the
    # server knock on every database of the cluster).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "paperclip.name" . }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    # External database (host not known to the chart): any host on 5432.
    - ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to external AI APIs (Claude, OpenAI, etc.)
    - ports:
        - protocol: TCP
          port: 443
    {{- if .Values.kubernetesExecution.enabled }}
    # Kubernetes API for the sandbox provider. Same shape as the measured precedent
    # platform/temporal-worker-egress-apiserver (10.3.0.1/32, 443 and 6443).
    - to:
        {{- range .Values.kubernetesExecution.apiServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.kubernetesExecution.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
{{- if .Values.postgresql.enabled }}
# NetworkPolicy: Bundled PostgreSQL pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paperclip.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "paperclip.name" . }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ONLY paperclip server -> bundled postgres
    - from:
        - podSelector:
            matchLabels:
              {{- include "paperclip.serverSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # DNS only
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}