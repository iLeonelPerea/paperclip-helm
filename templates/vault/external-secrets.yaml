{{- if .Values.vault.enabled }}
---
# ExternalSecret: Auth (BETTER_AUTH_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "paperclip.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStoreName | default (printf "%s-vault-store" (include "paperclip.fullname" .)) }}
    kind: ClusterSecretStore
  target:
    name: {{ include "paperclip.fullname" . }}-secret
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
  data:
    - secretKey: better-auth-secret
      remoteRef:
        key: {{ .Values.vault.authKey }}
        property: {{ .Values.vault.authProperty }}
---
# ExternalSecret: Database credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "paperclip.fullname" . }}-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStoreName | default (printf "%s-vault-store" (include "paperclip.fullname" .)) }}
    kind: ClusterSecretStore
  target:
    name: {{ include "paperclip.fullname" . }}-db-secret
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
  data:
    {{- if .Values.postgresql.enabled }}
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.vault.dbKey }}
        property: database-url
    - secretKey: username
      remoteRef:
        key: {{ .Values.vault.dbKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.dbKey }}
        property: password
    - secretKey: database
      remoteRef:
        key: {{ .Values.vault.dbKey }}
        property: database
    {{- else }}
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.vault.dbKey }}
        property: database-url
    {{- end }}
{{- with .Values.vault.imagePullSecret }}
---
# ExternalSecret: pull secret for our private images in THIS namespace — same
# template as alebrije-infra k8s/prod/regcred-external-secret.yaml (Vault
# ci/dockerhub). The inner {{ "{{ }}" }} are ESO's template, escaped for Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-eso
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperclip.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.vault.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.vault.clusterSecretStoreName | default (printf "%s-vault-store" (include "paperclip.fullname" $)) }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              {{ .registry | quote }}: {
                "username": "{{ "{{ .username }}" }}",
                "password": "{{ "{{ .token }}" }}",
                "auth": "{{ "{{ printf \"%s:%s\" .username .token | b64enc }}" }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: {{ .vaultKey }}
        property: {{ .usernameProperty }}
    - secretKey: token
      remoteRef:
        key: {{ .vaultKey }}
        property: {{ .tokenProperty }}
{{- end }}
{{- if .Values.crewHandoff.enabled }}
---
# ExternalSecret: Paperclip's login-handoff key, the SAME Vault property the
# platform adapter signs with (alebrije-adapt-paperclip, CREW_HANDOFF_KEY).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.crewHandoff.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStoreName | default (printf "%s-vault-store" (include "paperclip.fullname" .)) }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.crewHandoff.secretName }}
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
  data:
    - secretKey: {{ .Values.crewHandoff.secretKey }}
      remoteRef:
        key: {{ .Values.crewHandoff.vaultKey }}
        property: {{ .Values.crewHandoff.vaultProperty }}
{{- end }}
{{- end }}
