{{- if .Values.kubernetesExecution.enabled }}
{{- $prefix := .Values.kubernetesExecution.namespacePrefix }}
# =============================================================================
# Kubernetes sandbox provider — what this server may do in the cluster.
# The provider runs INSIDE the Paperclip server and talks to the API with this
# release's ServiceAccount (PAPERCLIP_K8S_IN_CLUSTER=true). Verbs derived from
# the calls it makes (packages/plugins/sandbox-providers/kubernetes/src,
# Paperclip v2026.1005.0).
#
# Least privilege, audited 2026-10-08 («audita que no dejes nada que nos hackeen»):
# reads are NOT admission-controlled, so a ClusterRoleBinding would have let a
# compromised server read pods and pod LOGS of every namespace. Instead:
#   - cluster-wide: only `get namespaces` (the provider reads its namespace first
#     and creates it only when missing — tenant-orchestrator.ts ensureNamespace);
#   - one sandbox namespace per company in sandboxCompanyIds, created HERE with
#     Pod Security «restricted», and a RoleBinding to the namespaced rules only
#     there. A company not listed cannot run agents: RBAC refuses, fail closed.
# The ValidatingAdmissionPolicies (admission-policy.yaml) stay as a second wall.
# No get/list on Secrets anywhere: the server writes per-run Secrets, never reads.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "paperclip.fullname" . }}-sandbox-provider
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  {{- if eq .Values.kubernetesExecution.backend "sandbox-cr" }}
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "create", "delete"]
  {{- end }}
  {{- if eq .Values.kubernetesExecution.egressMode "cilium" }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "paperclip.fullname" . }}-sandbox-namespace-reader
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "paperclip.fullname" . }}-sandbox-namespace-reader
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "paperclip.fullname" . }}-sandbox-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "paperclip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.kubernetesExecution.sandboxCompanyIds }}
{{- $ns := printf "%s%s" $prefix (lower .) }}
---
# Sandbox namespace of company {{ . }} (the provider derives <prefix><company id>,
# utils.ts deriveCompanySlug). Labels = exactly what tenant-orchestrator.ts writes.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    paperclip.io/managed-by: paperclip-k8s-plugin
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: paperclip
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "paperclip.fullname" $ }}-sandbox-provider
  namespace: {{ $ns }}
  labels:
    {{- include "paperclip.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "paperclip.fullname" $ }}-sandbox-provider
subjects:
  - kind: ServiceAccount
    name: {{ include "paperclip.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- if $.Values.kubernetesExecution.sandboxImagePullSecret }}
---
# Private runtime image (decided 2026-10-09: nothing published). Forced kubernetes
# mode has no PAPERCLIP_K8S_* for pull secrets, but the provider REUSES this
# ServiceAccount when it already exists (tenant-orchestrator.ts ensureServiceAccount:
# read, create only on 404) and its pods set no imagePullSecrets of their own
# (pod-spec-builder.ts), so the ServiceAccount admission adds this one. No API
# token: the agent pods never mount it (automountServiceAccountToken false there too).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.kubernetesExecution.tenantServiceAccountName }}
  namespace: {{ $ns }}
  labels:
    {{- include "paperclip.labels" $ | nindent 4 }}
    paperclip.io/managed-by: paperclip-k8s-plugin
automountServiceAccountToken: false
imagePullSecrets:
  - name: {{ $.Values.vault.imagePullSecret.name }}
---
{{ include "paperclip.pullSecretExternalSecret" (dict "root" $ "namespace" $ns) }}
{{- end }}
{{- end }}
{{- end }}
