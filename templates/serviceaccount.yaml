{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paperclip.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The kubernetes sandbox provider talks to the API with this account's token;
# without kubernetesExecution the token is not mounted at all.
automountServiceAccountToken: {{ .Values.kubernetesExecution.enabled }}
{{- end }}
