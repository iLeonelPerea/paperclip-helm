# =============================================================================
# Paperclip Helm Chart - Configuration Values
# =============================================================================

# -- Override chart name
nameOverride: ""
# -- Override full release name
fullnameOverride: ""
# -- Timezone for all containers (e.g., "UTC", "America/Mexico_City")
timezone: "UTC"

# -- Image configuration
image:
  repository: paperclipai/paperclip
  tag: "latest"
  # Pin by digest (ADR-158 M13): rendered as repository:tag@digest when set.
  digest: ""
  # true = refuse to render without a digest.
  requireDigest: false
  pullPolicy: IfNotPresent
  # -- Image pull secrets (for private registries)
  pullSecrets: []

# -- Number of replicas (Paperclip is stateful via /paperclip PVC, keep 1 unless RWX storage)
replicaCount: 1

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 3100
  annotations: {}

# =============================================================================
# Ingress (Traefik)
# =============================================================================
ingress:
  enabled: false
  # -- IngressClass name (e.g., traefik, nginx, gce)
  ingressClassName: traefik
  annotations: {}
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.tls: "true"
  host: "paperclip.example.com"
  tls: []
  # tls:
  #   - secretName: paperclip-tls
  #     hosts:
  #       - paperclip.example.com

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# =============================================================================
# Persistence - /paperclip volume (agent configs, conversation state)
# =============================================================================
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

# =============================================================================
# Extra environment variables (e.g., LLM provider API keys)
# Append entries to the container's `env` list. Sourced from K8s secrets
# (managed by ESO from Vault) — never inline literal values.
# =============================================================================
extraEnv: []
  # - name: ANTHROPIC_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: paperclip-anthropic-secret
  #       key: ANTHROPIC_API_KEY

# =============================================================================
# Extra envFrom sources (e.g., bulk-inject a whole secret as env vars)
# =============================================================================
extraEnvFrom: []
  # - secretRef:
  #     name: paperclip-extra-env

# =============================================================================
# Startup probe — the server applies pending migrations before it listens
# =============================================================================
startupProbe:
  # 10 s period → failureThreshold × 10 s is the boot window (30 ≈ 5 min).
  failureThreshold: 30

# =============================================================================
# Application Configuration
# =============================================================================
config:
  # -- Server port (must match service.port)
  port: 3100
  # -- Serve built React UI alongside the API
  serveUI: true
  # -- Deployment mode: "authenticated" (login required) | "open" (no auth)
  deploymentMode: authenticated
  # -- Network exposure: "private" | "public"
  deploymentExposure: private
  # -- Public URL used for OAuth callbacks, links in the UI, etc.
  # Set to your ingress host URL in production
  publicURL: "http://localhost:3100"

# =============================================================================
# Authentication Secret (BETTER_AUTH_SECRET)
# =============================================================================
auth:
  # -- Secret value for BetterAuth (random string, min 32 chars)
  # Leave empty to use existingSecret
  betterAuthSecret: ""
  # -- Name of existing Secret containing the auth secret key
  existingSecret: ""
  # -- Key name within the existing secret
  existingSecretKey: "better-auth-secret"
  # PAPERCLIP_AUTH_DISABLE_SIGN_UP. Closed by default: in-cluster callers (the
  # adapter AND the sandbox agents, which reach port 3100) could otherwise sign up.
  # Open it only while users are created (the install script does it per phase).
  disableSignUp: true

# =============================================================================
# PostgreSQL (embedded, optional)
# =============================================================================
postgresql:
  # -- Deploy embedded PostgreSQL. Set to false to use externalDatabase
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  auth:
    database: paperclip
    username: paperclip
    # -- PostgreSQL password. Leave empty to auto-generate, or use existingSecret
    password: ""
    # -- Use existing secret for PostgreSQL credentials (keys: username, password, database)
    existingSecret: ""

# =============================================================================
# External Database (when postgresql.enabled=false)
# =============================================================================
externalDatabase:
  # -- Full PostgreSQL connection string: postgresql://user:pass@host:5432/db
  url: ""
  # -- Use existing secret for DATABASE_URL (key defined by existingSecretKey)
  existingSecret: ""
  existingSecretKey: "database-url"

# =============================================================================
# Vault & External Secrets Operator (ESO) Integration
# =============================================================================
# When vault.enabled=true:
# - Chart creates ClusterSecretStore pointing to Vault
# - Chart creates ExternalSecret resources to pull secrets
# - Prerequisites: ESO must be pre-installed; Vault KV v2 must have secrets at {mount}/paperclip/*
vault:
  enabled: false
  address: "http://vault.vault.svc.cluster.local:8200"
  tlsSkipVerify: false
  role: "paperclip"
  mount: "paperclip"
  authPath: "kubernetes"
  serviceAccount: "paperclip-vault-auth"
  namespace: "vault"
  refreshInterval: "1h"
  # -- Retain or Delete K8s Secrets when ExternalSecret is deleted
  deletionPolicy: "Retain"
  # Use an EXISTING ClusterSecretStore (e.g. vault-backend) instead of creating one
  # with its own Vault role; the paths below are relative to that store.
  clusterSecretStoreName: ""
  authKey: "paperclip-auth"
  authProperty: "better-auth-secret"
  dbKey: "paperclip-db"
  # Pull secret materialized in this namespace: {name, registry, vaultKey,
  # usernameProperty, tokenProperty}. Empty = none.
  imagePullSecret: {}

# =============================================================================
# Security Contexts
# =============================================================================
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# =============================================================================
# Scheduling
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# ServiceAccount
# =============================================================================
serviceAccount:
  create: true
  name: ""
  annotations: {}

# =============================================================================
# Horizontal Pod Autoscaler (not recommended for stateful Paperclip)
# =============================================================================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# =============================================================================
# Pod Disruption Budget
# =============================================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicy:
  enabled: false
  # Namespace where Traefik ingress controller runs (ingress NetworkPolicy)
  traefikNamespace: "services"
  # Optional: allow ingress from additional namespace (e.g. monitoring)
  allowFromNamespace: ""
  # Extra ingress to the server port: [{namespace, podLabels, description}].
  extraIngress: []

# =============================================================================
# Reloader (Stakater) - auto-restart pods on ConfigMap/Secret changes
# =============================================================================
reloader:
  enabled: false

# =============================================================================
# Kubernetes execution (ADR-158 §0-ter): every agent run of every company goes to
# that company's sandbox namespace (<namespacePrefix><company id>), never to this
# pod — Paperclip's own switch, PAPERCLIP_EXECUTION_MODE=kubernetes + PAPERCLIP_K8S_*
# (server/src/services/execution-policy-bootstrap.ts). Needs the kubernetes sandbox
# provider BUILT into the image (the official image ships its source only; see
# image/Dockerfile). The provider hardcodes the server namespace "paperclip" and
# selects the server pod by app=paperclip-server for the agents' callback policy:
# with this on, the release MUST be installed in namespace "paperclip".
# =============================================================================
kubernetesExecution:
  enabled: false
  # job (stable, no CRD) | sandbox-cr (needs the kubernetes-sigs/agent-sandbox controller)
  backend: job
  namespacePrefix: "paperclip-sbx-"
  adapterType: claude_local
  # standard (NetworkPolicy; public IPv4 443/80 fallback for the adapter's FQDNs) | cilium
  egressMode: standard
  egressAllowCidrs: []
  egressAllowFqdns: []
  # e.g. kata-fc for microVM isolation (Kata Containers + Firecracker installed)
  runtimeClassName: ""
  rpcTimeoutMs: ""
  # PAPERCLIP_ADAPTERS: [{adapterType, runtimeImage}] — pin runtime images by digest.
  adapters: []
  apiServer:
    # Endpoint(s) of the `kubernetes` Service (kubectl get endpointslices -n default
    # -l kubernetes.io/service-name=kubernetes).
    cidrs: []
    ports: [443, 6443]
  admissionPolicy:
    # ValidatingAdmissionPolicy confining the server's writes to <namespacePrefix>*.
    enabled: true
  # One sandbox namespace per company id (created by this chart with a RoleBinding);
  # a company not listed cannot run agents — RBAC refuses, fail closed.
  sandboxCompanyIds: []
  # Private runtime images: every sandbox namespace also gets the provider's
  # ServiceAccount with imagePullSecrets [vault.imagePullSecret.name] and that pull
  # secret through ESO (needs vault.enabled + vault.imagePullSecret). Off = the
  # runtime images must be pullable anonymously.
  sandboxImagePullSecret: false
  # Must equal the provider's constant (plugin.ts TENANT_SERVICE_ACCOUNT,
  # tenant-orchestrator.ts SERVICE_ACCOUNT_NAME; v2026.1005.0).
  tenantServiceAccountName: paperclip-tenant-sa

# =============================================================================
# Password-less entry from the platform (ADR-158 §0-ter.4): Paperclip's own login
# handoff, GET /api/auth/workspace-handoff/exchange. Registered only when the key
# is present; accepts ONE company per instance (companyId). The key is the same
# Vault property the platform adapter signs with.
# =============================================================================
crewHandoff:
  enabled: false
  secretName: paperclip-crew-handoff
  secretKey: handoff-key
  vaultKey: services/adapt-paperclip
  vaultProperty: CREW_HANDOFF_KEY
  workspaceId: alebrije-crew
  # The company the ticket opens (set once it exists; empty = every ticket refused).
  companyId: ""
